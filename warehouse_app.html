<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>부자재 자재관리 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #58a6ff;
    --accent2: #1f6feb;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --orange: #e3b341;
    --purple: #a371f7;
    --grade-a: #3fb950;
    --grade-b: #58a6ff;
    --grade-c: #8b949e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* TOP NAV */
  .nav {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .nav-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .nav-title span { color: var(--accent); }
  .nav-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--accent2);
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
  }
  .tab {
    flex: 1;
    padding: 12px 4px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    user-select: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-icon { font-size: 18px; display: block; margin-bottom: 2px; }

  /* PAGES */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* SCAN PAGE */
  .scan-area {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  #scanner-container {
    position: relative;
    height: 220px;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #scanner-container video, #scanner-container canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  .scan-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 80px;
    border: 2px solid var(--accent);
    border-radius: 6px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 10;
  }
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    animation: scan 2s linear infinite;
    box-shadow: 0 0 8px var(--accent);
  }
  @keyframes scan { 0% { top: 4px; } 100% { top: calc(100% - 6px); } }
  .scan-inactive {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 220px;
    gap: 12px;
    color: var(--text2);
  }
  .scan-inactive .big-icon { font-size: 48px; }
  .scan-inactive p { font-size: 13px; }

  .scan-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent2);
    color: white;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .scan-btn:hover { background: var(--accent); }
  .scan-btn.stop { background: #21262d; border-top: 1px solid var(--border); }

  /* MANUAL SEARCH */
  .search-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .search-box h3 { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-weight: 500; }
  .input-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .btn-sm {
    padding: 10px 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.primary { background: var(--accent2); border-color: var(--accent2); color: white; }

  /* RESULT CARD */
  .result-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  .result-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .result-name { font-size: 14px; font-weight: 700; line-height: 1.4; flex: 1; }
  .grade-badge {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px;
  }
  .grade-A { background: rgba(63,185,80,0.2); color: var(--grade-a); border: 1px solid var(--grade-a); }
  .grade-B { background: rgba(88,166,255,0.2); color: var(--grade-b); border: 1px solid var(--grade-b); }
  .grade-C { background: rgba(139,148,158,0.2); color: var(--grade-c); border: 1px solid var(--grade-c); }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .info-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .info-label { font-size: 10px; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-value { font-size: 14px; font-weight: 600; }
  .info-value.mono { font-family: 'JetBrains Mono', monospace; }
  .info-value.red { color: var(--red); }
  .info-value.green { color: var(--green); }
  .info-value.yellow { color: var(--yellow); }

  .location-banner {
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .location-icon { font-size: 20px; }
  .location-text { font-size: 13px; }
  .location-text strong { color: var(--accent); font-size: 16px; }

  /* ACTION BUTTONS */
  .action-row { display: flex; gap: 8px; }
  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .action-btn.in { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.4); }
  .action-btn.out { background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid rgba(248,81,73,0.4); }
  .action-btn:hover { filter: brightness(1.2); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; top:0;left:0;right:0;bottom:0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg2);
    border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--border);
    padding: 20px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .modal-input-group { margin-bottom: 14px; }
  .modal-input-group label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 6px; }
  .modal-input-group input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    outline: none;
  }
  .modal-input-group input:focus { border-color: var(--accent); }
  .modal-buttons { display: flex; gap: 10px; margin-top: 16px; }
  .modal-btn {
    flex: 1;
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-btn.cancel { background: var(--bg3); color: var(--text2); }
  .modal-btn.confirm-in { background: var(--green); color: #000; }
  .modal-btn.confirm-out { background: var(--red); color: white; }

  /* INVENTORY LIST */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    background: var(--bg3);
    color: var(--text2);
    transition: all 0.2s;
    user-select: none;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.1); }
  .search-input-wrap { position: relative; margin-bottom: 12px; }
  .search-input-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px 10px 36px;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-input-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 16px; }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .item-row:hover { border-color: var(--accent); }
  .item-grade-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .dot-A { background: var(--grade-a); }
  .dot-B { background: var(--grade-b); }
  .dot-C { background: var(--grade-c); }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .item-stock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    text-align: right;
    flex-shrink: 0;
  }
  .load-more {
    text-align: center;
    padding: 12px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
  }
  .load-more:hover { color: var(--accent); }

  /* DASHBOARD */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.red { color: var(--red); }
  .stat-value.green { color: var(--green); }
  .stat-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grade-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .grade-seg { transition: width 0.5s ease; }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
  }
  .history-type {
    width: 44px;
    padding: 3px 0;
    border-radius: 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .history-type.in { background: rgba(63,185,80,0.2); color: var(--green); }
  .history-type.out { background: rgba(248,81,73,0.2); color: var(--red); }
  .history-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .history-qty { font-family: 'JetBrains Mono', monospace; font-weight: 700; flex-shrink: 0; }
  .history-time { font-size: 10px; color: var(--text2); flex-shrink: 0; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%; transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* NOT FOUND */
  .not-found {
    text-align: center;
    padding: 30px 16px;
    color: var(--text2);
  }
  .not-found .big { font-size: 40px; margin-bottom: 8px; }
  .not-found p { font-size: 13px; }

  /* PAGINATION */
  .pagination-info { font-size: 12px; color: var(--text2); text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">📦 <span>자재관리</span> 시스템</div>
  <div class="nav-badge" id="total-count">219개 품목</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')">
    <span class="tab-icon">📷</span>스캔
  </div>
  <div class="tab" onclick="switchTab('inventory')">
    <span class="tab-icon">📋</span>재고현황
  </div>
  <div class="tab" onclick="switchTab('dashboard')">
    <span class="tab-icon">📊</span>대시보드
  </div>
</div>

<!-- SCAN PAGE -->
<div class="page active" id="page-scan">
  <div class="scan-area">
    <div id="scanner-container">
      <div class="scan-inactive" id="scan-inactive">
        <div class="big-icon">📷</div>
        <p>카메라로 바코드를 스캔하세요</p>
      </div>
    </div>
    <button class="scan-btn" id="scan-toggle-btn" onclick="toggleScan()">
      📷 카메라 스캔 시작
    </button>
  </div>

  <div class="search-box">
    <h3>🔍 바코드 직접 입력</h3>
    <div class="input-row">
      <input type="text" id="barcode-input" placeholder="MAT0017" onkeydown="if(event.key==='Enter') searchBarcode()">
      <button class="btn-sm primary" onclick="searchBarcode()">조회</button>
    </div>
    <div style="margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;">
      <button class="btn-sm" onclick="quickSearch('MAT0017')" style="font-size:11px;">MAT0017 예시</button>
      <button class="btn-sm" onclick="quickSearch('MAT0163')" style="font-size:11px;">MAT0163 예시</button>
      <button class="btn-sm" onclick="quickSearch('MAT0042')" style="font-size:11px;">MAT0042 예시</button>
    </div>
  </div>

  <div id="scan-result"></div>
</div>

<!-- INVENTORY PAGE -->
<div class="page" id="page-inventory">
  <div class="search-input-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="inv-search" placeholder="자재명 또는 거래처 검색..." oninput="renderInventory()">
  </div>
  <div class="filter-row" id="grade-filters">
    <div class="filter-chip active" data-grade="ALL" onclick="setGradeFilter(this)">전체</div>
    <div class="filter-chip" data-grade="A" onclick="setGradeFilter(this)">🟢 A등급</div>
    <div class="filter-chip" data-grade="B" onclick="setGradeFilter(this)">🔵 B등급</div>
    <div class="filter-chip" data-grade="C" onclick="setGradeFilter(this)">⚪ C등급</div>
    <div class="filter-chip" data-grade="SHORTAGE" onclick="setGradeFilter(this)">🔴 부족</div>
  </div>
  <div class="item-list" id="item-list"></div>
  <div class="pagination-info" id="pagination-info"></div>
  <div class="load-more" id="load-more-btn" onclick="loadMore()">더 보기 ▼</div>
</div>

<!-- DASHBOARD PAGE -->
<div class="page" id="page-dashboard">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">총 품목 수</div>
      <div class="stat-value accent" id="stat-total">219</div>
      <div class="stat-sub">등록된 부자재</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">재고 부족 품목</div>
      <div class="stat-value red" id="stat-shortage">-</div>
      <div class="stat-sub">즉시 발주 필요</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">A등급 품목</div>
      <div class="stat-value green" id="stat-a">-</div>
      <div class="stat-sub">고빈도 회전 자재</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">오늘 입출고</div>
      <div class="stat-value accent" id="stat-today">0</div>
      <div class="stat-sub">건 처리됨</div>
    </div>
  </div>

  <p class="section-title">ABC 등급 분포</p>
  <div style="background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px;">
    <div class="grade-bar" id="grade-bar"></div>
    <div style="display:flex; gap: 16px; font-size: 12px;">
      <span style="color: var(--grade-a);">● A등급 <span id="bar-a-pct">-</span></span>
      <span style="color: var(--grade-b);">● B등급 <span id="bar-b-pct">-</span></span>
      <span style="color: var(--grade-c);">● C등급 <span id="bar-c-pct">-</span></span>
    </div>
  </div>

  <p class="section-title">Zone별 배치 현황</p>
  <div style="background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px;">
    <div id="zone-stats"></div>
  </div>

  <p class="section-title">입출고 이력</p>
  <div class="history-list" id="history-list">
    <div style="color: var(--text2); text-align: center; padding: 20px; font-size: 13px;">
      아직 입출고 내역이 없습니다.<br>스캔 탭에서 입출고를 처리하세요.
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-in">
  <div class="modal">
    <div class="modal-title">📥 입고 처리</div>
    <div id="modal-in-name" style="font-size: 13px; color: var(--text2); margin-bottom: 14px;"></div>
    <div class="modal-input-group">
      <label>입고 수량 (EA)</label>
      <input type="number" id="modal-in-qty" placeholder="0" min="1">

// State
let data = RAW_DATA.map(d => ({...d})); // mutable copy
let history = [];
let currentItem = null;
let scanActive = false;
let gradeFilter = 'ALL';
let inventoryPage = 1;
const PAGE_SIZE = 20;

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  updateDashboard();
  renderInventory();
});

// TAB SWITCHING
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['scan','inventory','dashboard'][i] === tab);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'inventory') renderInventory();
  if (tab === 'dashboard') updateDashboard();
}

// SCAN
function toggleScan() {
  if (scanActive) stopScan();
  else startScan();
}

function startScan() {
  const container = document.getElementById('scanner-container');
  document.getElementById('scan-inactive').style.display = 'none';
  Quagga.init({
    inputStream: {
      name: 'Live',
      type: 'LiveStream',
      target: container,
      constraints: { facingMode: 'environment', width: { min: 640 }, height: { min: 480 } }
    },
    decoder: { readers: ['code_128_reader','ean_reader','ean_8_reader','code_39_reader','upc_reader'] }
  }, (err) => {
    if (err) {
      showToast('카메라 접근 실패. 직접 입력을 이용하세요.', 'error');
      document.getElementById('scan-inactive').style.display = 'flex';
      return;
    }
    Quagga.start();
    scanActive = true;
    document.getElementById('scan-toggle-btn').textContent = '⏹ 스캔 중지';
    document.getElementById('scan-toggle-btn').classList.add('stop');

    // Add overlay
    const overlay = document.createElement('div');
    overlay.className = 'scan-overlay';
    overlay.innerHTML = '<div class="scan-line"></div>';
    container.appendChild(overlay);
  });
  Quagga.onDetected((result) => {
    const code = result.codeResult.code;
    stopScan();
    document.getElementById('barcode-input').value = code;
    searchBarcode();
  });
}

function stopScan() {
  if (!scanActive) return;
  Quagga.stop();
  scanActive = false;
  document.getElementById('scan-inactive').style.display = 'flex';
  document.getElementById('scan-toggle-btn').textContent = '📷 카메라 스캔 시작';
  document.getElementById('scan-toggle-btn').classList.remove('stop');
  // Remove overlay
  const overlay = document.querySelector('.scan-overlay');
  if (overlay) overlay.remove();
}

function quickSearch(code) {
  document.getElementById('barcode-input').value = code;
  searchBarcode();
}

function searchBarcode() {
  const input = document.getElementById('barcode-input').value.trim().toUpperCase();
  const item = data.find(d => d.barcode === input || d.barcode.toUpperCase() === input);
  if (item) showResult(item);
  else showNotFound(input);
}

        <button class="action-btn out" onclick="openModal('out')">📤 출고</button>
      </div>
    </div>`;
}

function showNotFound(code) {
  document.getElementById('scan-result').innerHTML = `
    <div class="not-found">
      <div class="big">🔍</div>
      <p>"${code}"에 해당하는 자재를 찾을 수 없습니다.</p>
    </div>`;
}

// MODAL
function openModal(type) {
  if (!currentItem) return;
  if (type === 'in') {
    document.getElementById('modal-in-name').textContent = currentItem.name;
    document.getElementById('modal-in-qty').value = '';
    document.getElementById('modal-in').classList.add('open');
    setTimeout(() => document.getElementById('modal-in-qty').focus(), 300);
  } else {
    document.getElementById('modal-out-name').textContent = currentItem.name;
    document.getElementById('modal-out-qty').value = '';
    document.getElementById('modal-out').classList.add('open');
    setTimeout(() => document.getElementById('modal-out-qty').focus(), 300);
  }
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function confirmIn() {
  const qty = parseInt(document.getElementById('modal-in-qty').value);
  if (!qty || qty <= 0) { showToast('수량을 입력하세요', 'error'); return; }
  currentItem.stock += qty;
  const idx = data.findIndex(d => d.barcode === currentItem.barcode);
  if (idx !== -1) data[idx] = currentItem;
  addHistory('in', currentItem, qty);
  closeModal('modal-in');
  showResult(currentItem);
  showToast(`✅ 입고 완료 +${qty.toLocaleString()}EA`, 'success');
  updateDashboard();
}

function confirmOut() {
  const qty = parseInt(document.getElementById('modal-out-qty').value);
  if (!qty || qty <= 0) { showToast('수량을 입력하세요', 'error'); return; }
  currentItem.stock -= qty;
  const idx = data.findIndex(d => d.barcode === currentItem.barcode);
  if (idx !== -1) data[idx] = currentItem;
  addHistory('out', currentItem, qty);
  closeModal('modal-out');
  showResult(currentItem);
  showToast(`✅ 출고 완료 -${qty.toLocaleString()}EA`, 'success');
  updateDashboard();
}

function addHistory(type, item, qty) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  history.unshift({ type, name: item.name, qty, time, barcode: item.barcode });
  if (history.length > 50) history.pop();
}

// INVENTORY
function setGradeFilter(el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  gradeFilter = el.dataset.grade;
  inventoryPage = 1;
  renderInventory();
}

function renderInventory() {
  const search = document.getElementById('inv-search').value.toLowerCase();
  let filtered = data.filter(item => {
    const matchSearch = !search || item.name.toLowerCase().includes(search) || item.vendor.toLowerCase().includes(search);
    const matchGrade = gradeFilter === 'ALL' || 
      (gradeFilter === 'SHORTAGE' ? item.stock <= 0 : item.grade === gradeFilter);
    return matchSearch && matchGrade;
  });

  const total = filtered.length;
  const shown = filtered.slice(0, inventoryPage * PAGE_SIZE);
  
  document.getElementById('item-list').innerHTML = shown.map(item => {
    const stockColor = item.stock > 0 ? 'var(--green)' : 'var(--red)';
    return `<div class="item-row" onclick="selectItem('${item.barcode}')">
      <div class="item-grade-dot dot-${item.grade}"></div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-meta">${item.vendor} · ${item.category} · ${item.location}</div>
      </div>
      <div class="item-stock" style="color:${stockColor}">${item.stock.toLocaleString()}</div>
    </div>`;
  }).join('');

  document.getElementById('pagination-info').textContent = `${Math.min(shown.length, total)} / ${total}개 표시`;
  document.getElementById('load-more-btn').style.display = shown.length >= total ? 'none' : 'block';
}

function loadMore() { inventoryPage++; renderInventory(); }

function selectItem(barcode) {
  const item = data.find(d => d.barcode === barcode);
  if (item) {
    switchTab('scan');
    document.getElementById('barcode-input').value = barcode;
    showResult(item);
    window.scrollTo(0, 0);
  }
}

// DASHBOARD
function updateDashboard() {
  const total = data.length;
  const shortage = data.filter(d => d.stock <= 0).length;
  const aCount = data.filter(d => d.grade === 'A').length;
  const bCount = data.filter(d => d.grade === 'B').length;
  const cCount = data.filter(d => d.grade === 'C').length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-shortage').textContent = shortage;
  document.getElementById('stat-a').textContent = aCount;
  document.getElementById('stat-today').textContent = history.length;

  // Grade bar
  const aPct = (aCount/total*100).toFixed(1);
  const bPct = (bCount/total*100).toFixed(1);
  const cPct = (cCount/total*100).toFixed(1);
  document.getElementById('grade-bar').innerHTML = `
    <div class="grade-seg" style="width:${aPct}%; background: var(--grade-a);"></div>
    <div class="grade-seg" style="width:${bPct}%; background: var(--grade-b);"></div>
    <div class="grade-seg" style="width:${cPct}%; background: var(--grade-c);"></div>`;
  document.getElementById('bar-a-pct').textContent = `${aCount}개 (${aPct}%)`;
  document.getElementById('bar-b-pct').textContent = `${bCount}개 (${bPct}%)`;
  document.getElementById('bar-c-pct').textContent = `${cCount}개 (${cPct}%)`;

  // Zone stats
  const zones = {};
  data.forEach(d => { zones[d.location] = (zones[d.location]||0) + 1; });
  document.getElementById('zone-stats').innerHTML = Object.entries(zones)
    .sort((a,b) => b[1]-a[1])
    .map(([zone, cnt]) => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom: 1px solid var(--border);">
        <span style="font-size:14px; font-weight:600;">${zone}</span>
        <div style="display:flex; align-items:center; gap: 12px;">
          <div style="width: 80px; height: 6px; background: var(--bg2); border-radius: 3px; overflow:hidden;">
            <div style="width:${cnt/total*100}%; height:100%; background: var(--accent); border-radius: 3px;"></div>
          </div>
          <span style="font-family:'JetBrains Mono',monospace; font-size:13px; color: var(--accent); width:30px; text-align:right;">${cnt}</span>
        </div>
      </div>`).join('');

  // History
  if (history.length === 0) {
    document.getElementById('history-list').innerHTML = `<div style="color: var(--text2); text-align: center; padding: 20px; font-size: 13px;">아직 입출고 내역이 없습니다.<br>스캔 탭에서 입출고를 처리하세요.</div>`;
  } else {
    document.getElementById('history-list').innerHTML = history.slice(0,10).map(h => `
      <div class="history-item">
        <div class="history-type ${h.type}">${h.type === 'in' ? '입고' : '출고'}</div>
        <div class="history-name">${h.name}</div>
        <div class="history-qty" style="color: ${h.type === 'in' ? 'var(--green)' : 'var(--red)'}">
          ${h.type === 'in' ? '+' : '-'}${h.qty.toLocaleString()}
        </div>
        <div class="history-time">${h.time}</div>
      </div>`).join('');
  }
}

// TOAST
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
